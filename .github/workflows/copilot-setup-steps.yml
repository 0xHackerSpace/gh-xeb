name: "Copilot Setup Steps"

# Prepares the environment for the GitHub Copilot coding agent. The job MUST be
# named `copilot-setup-steps` for Copilot to pick it up. `workflow_dispatch` and
# the push/pull_request triggers let us verify the steps still work.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Warm the module cache
        run: go mod download

      - name: Sanity check the toolchain
        run: |
          go version
          go build ./...
